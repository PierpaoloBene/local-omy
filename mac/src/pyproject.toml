[project]
name = "omy"
version = "1.0.0"
description = "local-omy on the Mac: segment receiver, iPhone install/renew"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # tools/inspect_segment.py; needs libopus (brew install opus)
    "opuslib>=3.0.1",
    "dateparser>=1.5.1",
    # was a transitive dependency of pyannote: the hub image has no pyannote
    "numpy>=2",
]

[project.scripts]
omy = "omy.cli:main"
omy-receiver = "omy_receiver.app:main"

[tool.hatch.build.targets.wheel]
packages = ["omy", "omy_receiver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# The Mac only: speaker diarization (omy diarize, the compute worker); the model needs a
# Hugging Face token. Not in the hub image (docker: `uv sync --no-group compute`).
compute = [
    "pyannote-audio>=4",
]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
# `uv sync` and `uv run` on the Mac keep installing pyannote, as before.
default-groups = ["dev", "compute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
