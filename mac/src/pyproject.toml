[project]
name = "omy"
version = "1.0.0"
description = "local-omy on the Mac: segment receiver, iPhone install/renew"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # tools/inspect_segment.py; needs libopus (brew install opus)
    "opuslib>=3.0.1",
    # speaker diarization (omy diarize); the model needs a Hugging Face token
    "pyannote-audio>=4",
]

[project.scripts]
omy = "omy.cli:main"
omy-receiver = "omy_receiver.app:main"

[tool.hatch.build.targets.wheel]
packages = ["omy", "omy_receiver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
