[project]
name = "omy-receiver"
version = "1.0.0"
description = "Receives local-omy audio segments on the Mac"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
omy-receiver = "omy_receiver.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
tools = ["opuslib>=3.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
