name: local_omy
description: "Records raw audio from an Omi pendant and delivers it to a Mac."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # BLE link to the pendant. Pinned to 1.x: 2.x changed license and API,
  # and 1.36 already has iOS autoConnect + state restoration.
  flutter_blue_plus: ^1.36.8
  # Documents directory where segments (= the upload queue) live.
  path_provider: ^2.1.1
  # Upload of segments to the Mac.
  http: ^1.2.0
  # Non-secret settings: saved pendant id, Mac URL.
  shared_preferences: ^2.2.0
  # Upload token, stored in the iOS Keychain.
  flutter_secure_storage: ^9.2.2
  # sha256 of each segment (no hashing in the Dart SDK).
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
